name: Secret scanning

on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner and scan history and current files
        shell: bash
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/scanner.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tool_dir/scanner.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/scanner.tar.gz" -C "$tool_dir" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$tool_dir/config.toml"
          touch "$tool_dir/ignore"
          if ! "$tool_dir/gitleaks" git . --log-opts='--all' --redact=100 --no-banner \
            --config "$tool_dir/config.toml" --gitleaks-ignore-path "$tool_dir/ignore" --ignore-gitleaks-allow \
            > "$tool_dir/history.log" 2>&1; then
            echo 'History secret scan failed: a finding or scanner error requires private local investigation.'
            exit 1
          fi
          if ! "$tool_dir/gitleaks" dir . --redact=100 --no-banner \
            --config "$tool_dir/config.toml" --gitleaks-ignore-path "$tool_dir/ignore" --ignore-gitleaks-allow \
            > "$tool_dir/files.log" 2>&1; then
            echo 'Current-file secret scan failed: a finding or scanner error requires private local investigation.'
            exit 1
          fi
          echo 'Secret scans passed.'
